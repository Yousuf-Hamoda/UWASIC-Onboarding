# Tiny Tapeout project information
project:
  title: "ASIC Onboarding Project - Yousuf Hamoda"
  author: "Yousuf Hamoda"
  discord: "sofa44"
  description: "SPI-controlled PWM peripheral for Tiny Tapeout."
  language: "Verilog"
  clock_hz: 10000000 # 10 MHz (the spec's clock)
  tiles: "1x1"
  top_module: "tt_um_uwasic_onboarding_yousuf_hamoda"
  source_files:
    - "project.v"
    - "spi_peripheral.v"
    - "pwm_peripheral.v"


# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
